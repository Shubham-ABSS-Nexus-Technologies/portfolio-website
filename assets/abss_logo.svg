<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#90E0EF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing network hexagon structure -->
  <path d="M 50 15 L 80 32.5 L 80 67.5 L 50 85 L 20 67.5 L 20 32.5 Z" 
        fill="none" 
        stroke="url(#logoGrad)" 
        stroke-width="2.5" 
        stroke-dasharray="4 2" 
        opacity="0.6" />
  
  <!-- Central interconnected Nexus nodes -->
  <circle cx="50" cy="50" r="12" fill="none" stroke="url(#logoGrad)" stroke-width="3" filter="url(#glow)" />
  <circle cx="50" cy="25" r="5" fill="#00B4D8" />
  <circle cx="72.5" cy="37.5" r="5" fill="#00B4D8" />
  <circle cx="72.5" cy="62.5" r="5" fill="#90E0EF" />
  <circle cx="50" cy="75" r="5" fill="#90E0EF" />
  <circle cx="27.5" cy="62.5" r="5" fill="#00B4D8" />
  <circle cx="27.5" cy="37.5" r="5" fill="#90E0EF" />
  
  <!-- Connections -->
  <line x1="50" y1="25" x2="50" y2="38" stroke="url(#logoGrad)" stroke-width="2" />
  <line x1="50" y1="75" x2="50" y2="62" stroke="url(#logoGrad)" stroke-width="2" />
  <line x1="27.5" y1="37.5" x2="39" y2="44" stroke="url(#logoGrad)" stroke-width="2" />
  <line x1="72.5" y1="62.5" x2="61" y2="56" stroke="url(#logoGrad)" stroke-width="2" />
  <line x1="72.5" y1="37.5" x2="61" y2="44" stroke="url(#logoGrad)" stroke-width="2" />
  <line x1="27.5" y1="62.5" x2="39" y2="56" stroke="url(#logoGrad)" stroke-width="2" />
</svg>
